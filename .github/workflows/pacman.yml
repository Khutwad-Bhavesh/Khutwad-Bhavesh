name: Generate Pacman Contribution Graph
on:
  schedule:
    - cron: '0 0 * * *'   # once a day
  workflow_dispatch:        # lets you trigger it manually

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: abozanona/pacman-contribution-graph@v1
        with:
          github_user_name: Khutwad-Bhavesh
          github_token: ${{ secrets.GITHUB_TOKEN }}
          game_name: pacman
